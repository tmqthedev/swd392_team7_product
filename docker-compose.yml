# Local development stack for the AIVES viva platform.
#
# Behavior differs from production ONLY by env values (no `if (local)` branches
# anywhere in the application). `docker compose up` brings up the full stack
# behind nginx on http://localhost:8080; the Mailpit UI is on http://localhost:8025
# and the MinIO console on http://localhost:9001.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aives
      POSTGRES_PASSWORD: aives
      POSTGRES_DB: aives
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aives -d aives"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb:
        condition: service_started
    environment:
      PORT: 3000
      DB_MOCK_MODE: "false"
      AWS_MOCK_MODE: "false"
      STT_PROVIDER: lambda
      TTS_PROVIDER: kokoro
      AUDIO_LAMBDA_FUNCTION_NAME: function
      TTS_LAMBDA_FUNCTION_NAME: function
      LLM_PROVIDER: bedrock
      EMBEDDING_PROVIDER: bedrock
      STT_TIMEOUT_MS: "120000"
      TTS_TIMEOUT_MS: "180000"
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      STORAGE_BUCKET_AUTO_CREATE: "true"
      AUDIO_BUCKET_NAME: local-audio-bucket
      MATERIALS_BUCKET_NAME: local-materials-bucket
      SESSION_TABLE_AUTO_CREATE: "true"
      DATABASE_URL: postgres://aives:aives@postgres:5432/aives
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      S3_ENDPOINT: http://minio:9000
      LAMBDA_ENDPOINT: http://stt:8080
      TTS_LAMBDA_ENDPOINT: http://tts:8080
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      APP_BASE_URL: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-only}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-apac.amazon.nova-pro-v1:0}
      BEDROCK_EMBED_MODEL_ID: ${BEDROCK_EMBED_MODEL_ID:-amazon.titan-embed-text-v2:0}
    expose:
      - "3000"

  dynamodb:
    image: amazon/dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb"]
    ports:
      - "8000:8000"

  minio:
    # minio/minio was removed from Docker Hub; pgsty/minio is a drop-in rebuild
    # of upstream MinIO (same `minio server` CLI, env and ports), pinned.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:8080"

  # Real bilingual STT, with models baked into the Lambda RIE image.
  stt:
    build:
      context: ./lambda/stt
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    # Models are baked into the image at build time (lambda/stt/build_models.py).
    environment:
      - STT_DEVICE=cpu
      - STT_COMPUTE_TYPE=int8

  # Real bilingual Kokoro TTS (Lambda RIE).
  tts:
    build:
      context: ./lambda/tts
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    # Models are baked into the image at build time (lambda/tts/build_models.py).

volumes:
  postgres-data:
  minio-data:
