# Local development stack for the AIVES viva platform.
#
# Behavior differs from production ONLY by env values (no `if (local)` branches
# anywhere in the application). `docker compose up` brings up the full stack
# behind nginx on http://localhost:8080; the Mailpit UI is on http://localhost:8025
# and the MinIO console on http://localhost:9001.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aives
      POSTGRES_PASSWORD: aives
      POSTGRES_DB: aives
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aives -d aives"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_MOCK_MODE: "false"
      AWS_MOCK_MODE: "true"
      DATABASE_URL: postgres://aives:aives@postgres:5432/aives
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      S3_ENDPOINT: http://minio:9000
      LAMBDA_ENDPOINT: http://stt:8080
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      APP_BASE_URL: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-only}
      BEDROCK_MODEL_ID: anthropic.claude-3-5-sonnet-20240620-v1:0
      BEDROCK_EMBED_MODEL_ID: amazon.titan-embed-text-v2:0
    expose:
      - "3000"

  dynamodb:
    image: amazon/dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb"]
    ports:
      - "8000:8000"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:8080"

  # stt (speech-to-text) placeholder. The real PhoWhisper Lambda RIE image is
  # delivered in Step 9; until then it is intentionally commented out and
  # NOTHING depends_on it, so `docker compose up` never blocks on a missing
  # image. The backend already points LAMBDA_ENDPOINT at http://stt:8080 so
  # wiring is a no-op until this block is uncommented.
  #
  # stt:
  #   build: ./stt
  #   ports:
  #     - "8080:8080"

volumes:
  postgres-data:
  minio-data:
