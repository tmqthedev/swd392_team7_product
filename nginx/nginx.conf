worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  upstream backend_upstream {
    server backend:3000;
  }

  # One origin for everything: the SPA at / and the API at /api. The browser
  # therefore sends the auth cookies without CORS, and the backend's Origin
  # check sees APP_BASE_URL (http://localhost:8080).
  server {
    listen 8080;
    server_name _;

    # Course materials may be up to 50 MB (see materialRoutes MAX_FILE_BYTES).
    client_max_body_size 55m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health passthrough: `curl http://localhost:8080/health`.
    location = /health {
      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so deep links (e.g. /set-password?token=...) load index.html.
    location / {
      try_files $uri /index.html;
    }
  }
}
