worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Minimal front proxy for the local stack. nginx listens on :8080 and proxies
  # every request to the backend service (http://backend:3000), forwarding the
  # standard headers so the app sees the original host/scheme/client IP.
  upstream backend_upstream {
    server backend:3000;
  }

  server {
    listen 8080;
    server_name _;

    # Health passthrough: lets `curl http://localhost:8080/health` hit the
    # backend's health endpoint directly.
    location /health {
      proxy_pass http://backend_upstream/health;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
