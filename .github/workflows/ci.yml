# Continuous integration for AIVES.
# NOTE: the deploy workflow (Step 11) triggers on `workflow_run` of the workflow
# named exactly "CI" — do not rename.
name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aives
          POSTGRES_PASSWORD: aives
          POSTGRES_DB: aives
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aives -d aives"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # DUMMY values only. The Postgres-backed e2e suites (migrations, jobQueue,
      # step4, examSessions) self-skip unless TEST_DATABASE_URL is set.
      TEST_DATABASE_URL: postgres://aives:aives@localhost:5432/aives
      JWT_SECRET: ci-dummy-jwt-secret-not-real
      AWS_MOCK_MODE: 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Node 22, not 20: `npm test` passes a glob to `node --test`, which only
      # Node >= 21 expands. The node:20 runtime image is still exercised by the
      # compose-smoke job.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Unit tests (node:test)
        run: npm test
      - name: E2E tests (Jest, incl. Postgres-backed suites)
        run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # oxlint exits non-zero only on errors; warnings are reported but do not fail.
      - run: npm run lint
      - run: npm test

  # Builds the STT Lambda image (models baked in) and invokes it through the
  # Lambda Runtime Interface Emulator shipped in the base image. linux/amd64
  # here for speed; deploy.yml builds the arm64 image from the same Dockerfile.
  stt-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build STT image
        uses: docker/build-push-action@v7
        with:
          context: lambda/stt
          load: true
          tags: aives-stt:ci
          cache-from: type=gha,scope=stt-ci
          cache-to: type=gha,mode=max,scope=stt-ci
      - name: Invoke through the Runtime Interface Emulator
        run: |
          docker run -d --name stt -p 9001:8080 aives-stt:ci
          python3 - <<'PY'
          import base64, io, json, time, urllib.request, wave
          url = "http://localhost:9001/2015-03-31/functions/function/invocations"
          def invoke(payload):
              for _ in range(30):
                  try:
                      req = urllib.request.Request(url, data=json.dumps(payload).encode())
                      return json.loads(urllib.request.urlopen(req, timeout=120).read())
                  except OSError:
                      time.sleep(2)
              raise SystemExit("RIE did not answer")
          buf = io.BytesIO()
          with wave.open(buf, "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
              w.writeframes(b"\x00\x00" * 16000)
          audio = base64.b64encode(buf.getvalue()).decode()
          for lang in ("vi", "en"):
              warm = invoke({"action": "warmup", "language": lang})
              print("warmup", warm)
              assert warm.get("status") == "warm" and warm.get("language") == lang, warm
              out = invoke({"audio_base64": audio, "content_type": "audio/wav", "language": lang})
              print("transcribe", out)
              assert "text" in out and "words" in out and "errorMessage" not in out, out
          PY
      - name: Dump STT logs
        if: always()
        run: docker logs stt || true

  tts-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build TTS image
        uses: docker/build-push-action@v7
        with:
          context: lambda/tts
          load: true
          tags: aives-tts:ci
          cache-from: type=gha,scope=tts-ci
          cache-to: type=gha,mode=max,scope=tts-ci
      - name: Invoke through the Runtime Interface Emulator
        run: |
          docker run -d --name tts -p 9002:8080 aives-tts:ci
          python3 - <<'PY'
          import base64, json, time, urllib.request
          url = "http://localhost:9002/2015-03-31/functions/function/invocations"
          def invoke(payload):
              for _ in range(30):
                  try:
                      req = urllib.request.Request(url, data=json.dumps(payload).encode())
                      return json.loads(urllib.request.urlopen(req, timeout=120).read())
                  except OSError:
                      time.sleep(2)
              raise SystemExit("RIE did not answer")
          texts = {
              "vi": "Hãy trình bày sự khác nhau giữa biểu đồ ca sử dụng và biểu đồ tuần tự.",
              "en": "Please explain the difference between a use case diagram and a sequence diagram.",
          }
          for lang, text in texts.items():
              warm = invoke({"action": "warmup", "language": lang})
              print("warmup", warm)
              assert warm.get("status") == "warm" and warm.get("language") == lang, warm
              out = invoke({"text": text, "language": lang})
              assert "errorMessage" not in out, out
              audio = out.get("audio_base64") or ""
              print("synthesize", lang, out.get("voice"), out.get("content_type"), out.get("duration"),
                    len(base64.b64decode(audio)), "bytes")
              assert audio, "empty audio_base64"
              assert out.get("content_type") == "audio/wav", out.get("content_type")
              assert out.get("duration", 0) > 0, out.get("duration")
          # Errors are raised, never masked as silent audio.
          empty = invoke({"text": "", "language": "vi"})
          print("empty text", empty.get("errorType"), empty.get("errorMessage"))
          assert "errorMessage" in empty, empty
          PY
      - name: Dump TTS logs
        if: always()
        run: docker logs tts || true

  compose-smoke:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DC: docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.test.yml
      SMOKE_ADMIN_EMAIL: admin@ci.local
      SMOKE_ADMIN_PASSWORD: ci-dummy-password-123
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Generate CI env file (dummy secrets only)
        run: |
          cp .env.example .env.ci
          sed -i \
            -e 's|^AWS_MOCK_MODE=.*|AWS_MOCK_MODE=true|' \
            -e 's|^DB_MOCK_MODE=.*|DB_MOCK_MODE=false|' \
            -e 's|^JWT_SECRET=.*|JWT_SECRET=ci-dummy-jwt-secret-not-real|' \
            -e 's|^APP_BASE_URL=.*|APP_BASE_URL=http://localhost:8080|' \
            .env.ci
          printf 'EMBEDDING_PROVIDER=mock\nLLM_PROVIDER=mock\nTTS_PROVIDER=mock\n' >> .env.ci
      - name: Validate compose file
        run: $DC config --quiet
      # The AWS_MOCK_MODE stack plus minio (unused in mock mode, but started so
      # the pinned image in docker-compose.yml is proven pullable and runnable).
      # dynamodb is unused in mock mode and skipped.
      - name: Build and start stack
        run: $DC up -d --build postgres backend mailpit nginx minio
      - name: Wait for MinIO liveness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live; then echo "minio live after ${i} tries"; exit 0; fi
            sleep 2
          done
          echo "minio did not become live within 60s"; exit 1
      - name: Wait for backend health through nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then echo; echo "healthy after ${i} tries"; exit 0; fi
            sleep 3
          done
          echo "backend did not become healthy within 180s"; exit 1
      - name: Create admin
        # Pass every flag: an omitted optional flag falls back to a readline
        # prompt, which on a closed stdin exits 0 without creating the user.
        run: $DC exec -T backend npm run create-admin -- --code CIADMIN --email "$SMOKE_ADMIN_EMAIL" --full-name "CI Admin" --password "$SMOKE_ADMIN_PASSWORD"
      - name: Smoke test
        run: node scripts/ci-smoke.mjs
      - name: Dump compose logs on failure
        if: failure()
        run: |
          $DC ps -a
          $DC logs --no-color
      - name: Tear down
        if: always()
        run: $DC down -v
